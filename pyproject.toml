[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patching_tflite"
version = "0.2.0"
description = "Generic instrumentation, tracing, profiling, and tensor mutation framework for any TFLite-based shared library"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Research Team" }
]
dependencies = []

[project.scripts]
tflite-patch = "patching_tflite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["patching_tflite*"]
